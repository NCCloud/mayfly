version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      day: "friday"
      time: "12:00"
      interval: "weekly"
      timezone: "Europe/Rome"
    ignore:
      # gocron after v2.16.3 drops or hangs a one-time job whose start passes during registration
      - dependency-name: "github.com/go-co-op/gocron/v2"
        versions: [ ">=2.16.4" ]
  - package-ecosystem: docker
    directory: /
    schedule:
      day: "friday"
      time: "12:00"
      interval: "weekly"
      timezone: "Europe/Rome"
